# /etc/nginx/sites-available/ocr.recriauth.com
# Symlink into sites-enabled, then `sudo nginx -t && sudo systemctl reload nginx`.

# HTTP → HTTPS redirect. certbot will add a server block on :443 with the
# cert paths the first time you run `sudo certbot --nginx -d ocr.recriauth.com`.
server {
    listen 80;
    listen [::]:80;
    server_name ocr.recriauth.com;

    # certbot uses /.well-known/acme-challenge/* over HTTP for renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ocr.recriauth.com;

    # certbot will rewrite these paths on first run; leave them in place
    # so reloads after renewal Just Work.
    ssl_certificate     /etc/letsencrypt/live/ocr.recriauth.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ocr.recriauth.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # KYC uploads (PDFs / scanned images) — keep generous but bounded.
    client_max_body_size 25m;
    client_body_timeout  60s;

    # Security headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # gzip JSON responses — payloads are JSON, not images, so this is a win.
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 512;
    gzip_proxied any;

    access_log /var/log/nginx/ocr.access.log;
    error_log  /var/log/nginx/ocr.error.log warn;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pipeline + cold-start budget. Must exceed gunicorn's timeout (120s)
        # so nginx doesn't cut a request the worker is still processing.
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;

        # Buffer uploaded files to disk if larger than this — avoids holding
        # multi-MB scans in nginx RAM.
        client_body_buffer_size 1m;
        proxy_request_buffering on;
        proxy_buffering on;
    }
}
